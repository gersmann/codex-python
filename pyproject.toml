[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-python"
description = "Python SDK for the Codex app-server"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["codex", "sdk", "cli", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.11.7,<3",
  # The Codex version this SDK targets; also pinned in .github/workflows/codex-autoreview.yml.
  "openai-codex-cli-bin==0.167.0",
]

[project.optional-dependencies]
websocket = [
  "websockets>=15.0.1,<16",
]

[project.urls]
Homepage = "https://github.com/gersmann/codex-python"
Repository = "https://github.com/gersmann/codex-python"
Issues = "https://github.com/gersmann/codex-python/issues"

[tool.hatch.version]
path = "codex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["codex"]

[tool.hatch.build.targets.sdist]
include = ["/codex", "/README.md", "/LICENSE", "/pyproject.toml"]

# Development dependency groups (used by uv)
[dependency-groups]
dev = [
  "ruff>=0.13.1",
  "pytest>=8",
  "pytest-cov>=6.0.0",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["codex-proj", ".generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["codex"]
omit = ["codex/protocol/types.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
  "^codex-proj/",
  "^\\.generated/",
  "^dist/",
]
